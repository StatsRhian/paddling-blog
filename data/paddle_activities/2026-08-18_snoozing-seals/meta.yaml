id: "2026-08-18_snoozing-seals"
date: "2026-08-18"
title: "Snoozing seals"
club: "peer"
venue: "aberdeenshire"
description: |
  A windy start meant a slow morning of table tennis at the campsite. By midday the wind had dropped and we paddled from Sandhaven around Kinnaird Head lighthouse (the first lighthouse built in Scotland). We continued on, to Fraserburgh pier and then turned back and paddled through the chop.
  
  Back at Sandhaven, we found the seals "bottling". One was snoring as we quietly paddled past, trying not to wake it. Finished with chips and ice cream in Fraserburgh