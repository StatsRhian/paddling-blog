date: "2026-08-17"
title: "A skyful of Gannets"
club: "peer"
venue: "aberdeenshire"
description: |
  Kirstie’s van was finally fixed! We headed down the steep, windy road to Pennan (famous for Local Hero) and stopped at Coastal Cuppie for a coffee and cake before launching from the harbour.
  
  The lovely lady there told us she used to paddle from Rosehearty to run the coffee shack before moving to Pennan. What a commute! We later found out she’d stayed open late to make sure we got off the water safely 🥹
  
  Then out from the harbour and along to Troup Head. The gannetry was the absolute highlight, 40,000 gannets swirling above us making an incredible racket. We could pick out the younger, black-speckled birds amongst the bright white adults. They seemed to follow us for quite a while, circling overhead.
  
  The fulmars were showing off too, swooping down in front of the boats and changing direction at the last second. They make flying look ridiculously easy.
  
  We had lunch in Crovie in the sunshine before heading back around Troup Head into a bit of wind and chop.
  
  Finished with a swim in the harbour, where some local ladies very enthusiastically sang Happy Birthday to Gayle. 🥹🎂