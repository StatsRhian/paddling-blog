date: "2026-08-22"
title: "Isle of May"
club: "peer"
venue: "fife"
description: |
  We headed to Cellardyke to meet up with Kirstie's friend Crispin. With settled weather forecast it seemed a great opportunity to do the crossing to the Isle of May
  
  Despite having limited vision due to a degenerative eye disease, Crispin knew every inch of the Isle of May and took great delight in sharing his knowledge with us. I love how sea kayakers are always so willing to share their knowledge. There were plenty of arches to explore and a few through-tunnels.
  
  The swell was quite big on the easterly side so we weren't able to land on the island although I did manage a quick rocky landing wee stop on the sheltered side of the island before we paddled back.
  
  On the paddle back we spotted the brand new NLB ship "Pole Star V". We had been admiring models of those ships two days earlier at the Museum Of Scottish Lighthouses in Fraserburgh so it was nice to spot one in person.
  
  Afterwards we sat in Crispen's sunny backgarden and had a couple of tea and apple slices from the local bakery. It was a real privilege to get to paddle with Crispin and get his tour of the Isle of May.