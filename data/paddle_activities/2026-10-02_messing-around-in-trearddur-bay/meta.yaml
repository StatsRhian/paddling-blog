date: "2026-10-02"
title: "Messing around in Trearddur Bay"
club: "peer"
venue: "anglesey"
description: |
  F6 gusting F8 so not a day for paddling far!
  
  We did a few runs across from one sheltered bay to another - dipping into the winds, surfing the waves and then diving back to shelter.
  
  The waves weren't great for surfing but at least they weren't breaking on us. We worked in smaller groups as trying to communicate in strong wind is tricky. Big rolling swell and the onshore wind actually made it a perfect playground.
  
  With Paul, Sarah, Mark, Kev, Kev P & Josh.