date: "2026-07-19"
title: "Priest island from Mellon Udrigle"
club: "peer"
venue: "summer-isles"
description: |
  Mellon Udrigle is a stunning beach. Kirstie suggested we paddle from there partly because it's the most accessible way to get to priest island and partly because the name of the village sounds a bit like a Howarts professor 😂
  
  The 5k crossing took an hour and then we headed straight to the north tip to explore caves. The Grand Priest Arch was so good we did it twice, beautifully framing Inverpollaidh and Assynt mountains.
  
  We also found the skylight cave accidentally. As we paddled past we heard the roar of water bouncing down a long channel and had to go check it out. The noise coming out of the back of that cave is enough to make me believe in monsters 👹
  
  We had lunch at a pebbly beach where sadly we found a dead sea eagle. Even though it's claws were massive we reckon it was maybe a juvenile. It was ringed so we reported it.
  
  We had a headwind all of the 5k back. The thought of the Blasta honesty cake box at the finish helped keep us going 😋