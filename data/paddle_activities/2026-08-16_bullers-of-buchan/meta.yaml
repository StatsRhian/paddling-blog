date: "2026-08-16"
title: "Bullers of Buchan"
club: "peer"
venue: "aberdeenshire"
description: |
  This morning started with breaching dolphins at Stonehaven Harbour, followed by coffee and croissants at the pier café. 😋 Then a quick stop at Kwik Fit to get Kirstie’s oil leak checked before heading north to meet Gayle at Boddam Harbour.
  
  Boddam might not be the prettiest launch spot, but it does have a rather lovely Stevenson lighthouse with a classic red stripe.
  
  Almost immediately we were into caves, tunnels and huge cliffs covered in kittiwakes. We spent the whole day poking our noses into every nook and cranny until our brains were tired from exploring. Every time we rounded a headland there seemed to be a whole new smorgasbord of possibilities.
  
  One of the highlights was an aquamarine cave where the water was an incredible blue-green. I think the rock was undercut beneath the water, letting light stream up through it.