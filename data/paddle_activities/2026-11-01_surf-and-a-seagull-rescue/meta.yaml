id: "2026-11-01_surf-and-a-seagull-rescue"
date: "2026-11-01"
title: "Surf and a seagull rescue"
club: "peer"
venue: "coquet"
description: |
  1m, 5sec swell northerly swell made for some fun conditions.
  
  Borrowed Sarah’s Greenland stick for a bit of a play, but switched back to my euro blades when it got lumpy around the back of the island. It’s pupping season at Coquet, so we gave the seals a wide berth.
  
  We had a quick stop at Low Hauxley beach. Unused to the Greenland stick, I had a slightly undignified surf landing, lost my glasses and a near collision with Angry Mark. 🙈
  
  On the way back, we spotted a gull tangled in fishing line, struggling to free itself. Josh managed to cut away most of the line and it was able to fly off.
  
  We finished up with some lovely little surfable waves at the beach within the North Pier, catching up with the Coquet paddlers. Surprisingly powerful for their size, and I caught a few good rides. Turns out I'm enjoying this surfing lark!
  
  Cracking day. A bit of everything.
  
  Sarah, Paul, Mark, Cath, Clare, Pauline, Josh, Mal, (Angry) Mark.