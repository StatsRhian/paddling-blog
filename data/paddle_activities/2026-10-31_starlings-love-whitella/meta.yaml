date: "2026-10-31"
title: "Starlings love Whitella"
club: "tynemouth"
venue: "tynemouth"
description: |
  A grey start gave way to clear skies and a warm October sun. ☀️
  
  Clapotis along the pier, but smooth, gentle swell once we rounded the corner. Plenty of familiar faces I hadn’t seen in a while meant lots of chatter as we paddled past Cullercoats to Whitley Bay.
  
  We stopped at Di Meo's for hot chocolates and Whitella (Whitley Bay’s take on Nutella ice cream 🍦). It's always fun to watch the murmuration of chattering starlings that like hanging out there in hope of some crumbs.
  
  The paddle back took a little longer into the wind. We said goodbye to Gayle and Kirstie as they crossed the Tyne.
  
  13 out in total. A great turnout for a club paddle.
  
  Paul, Sarah, Mark, Lorna, Pauline, Jonny, Josh, Gav, Sophie, Orla, Kirstie and Gayle.