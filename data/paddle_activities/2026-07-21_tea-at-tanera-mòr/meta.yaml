date: "2026-07-21"
title: "Tea at Tanera Mòr"
club: "tynemouth"
venue: "summer-isles"
description: |
  We headed straight to Eilean Mullagrach to get stuck in to the features. The West coast was a bit too spicy so we stayed between the islands. Kev did an impressive roll in a gully when a big set of waves came in.
  
  I remembered my headtorch today so I could paddle right to the back of Am Fang - pitchblack.
  
  We had a quick lunch at Mol Mòr on the mainland before heading to Tanera Mòr for tea. Tanera Mòr is a owned by a multi millionaire and part of a huge, luxorious restoration project. If you land at "The Mess" (Ardnagoine) the uniformed staff quickly drive down to meet you at the water. They are very and friendly and chatty and usually offer us cups of tea before launching into a lecture about how impactful the charity is.
  
  They also invited us to have a look around Herring Station which had accomodation, toilets and an art room. It's being impeccably recovated with great care and at great expense. The whole island is very secretive and I can't shake having a slightly sinister feeling about the place.
  
  Maybe I've just watched too much Wicker Man. There were eight seats waiting for us when we found the firepit. Exactly the right number for us... 😅
  
  With Paul, Mark, Kev, Cath, Claire, Kane, Josh.