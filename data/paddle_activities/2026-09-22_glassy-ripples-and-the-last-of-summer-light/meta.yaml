date: "2026-09-22"
title: "Glassy ripples and the last of summer light"
club: "peer"
venue: "tynemouth"
description: |
  Short after work paddle with Paul and Kane to Browns Bay and back.
  
  The sea was flat with glassy ripples, which reminded Kane and I of video game graphics.
  
  We just got off the water as the sun was setting about 7pm. Probably one of the last summer evening paddles in the light.
  
  The rowers were moving their boats back after the weekend racing Loch Lomond so we had to rinse our kayaks very quickly to stay out of their way.