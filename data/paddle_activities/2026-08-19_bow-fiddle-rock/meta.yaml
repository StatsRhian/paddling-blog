title: "Bow Fiddle rock"
club: "peer"
venue: "moray"
description: |
  We set off from Portessie heading straight for Bow Fiddle Rock. The swell was up, so there wasn’t much opportunity for rock hopping, and it was a very different day from my last visit when it was flat calm!
  
  Kirstie and I paddled through the arch, with plenty of clapotis at the entrance and exit but surprisingly smooth water in the middle. As we paddled back around, the swell was clearly building and much bigger than forecast, so we turned back. It was the biggest swell Gayle had paddled in, but she gritted her teeth, kept her goosey loosey hips and did brilliantly. 🙌
  
  After a quick lunch stop at Portknockie and a “paddle” in the paddling pool, we headed back with the swell, finishing with cake and coffee at Bijou Café. ☕️🍰
  
  A bigger-condition day than planned, but great fun!