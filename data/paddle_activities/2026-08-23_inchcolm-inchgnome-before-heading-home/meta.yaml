date: "2026-08-23"
title: "Inchcolm & Inchgnome before heading home"
club: "peer"
venue: "fife"
description: |
  Bright blue skies and a warm sun for our last little paddle in the Forth. Spotted the RNLI doing some training at Inchcombe, did a loop of Oxcarr lighthouse and then back via Inchgnome. It's been lovely getting to know the east coast of Scotland a bit better.