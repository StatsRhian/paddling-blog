title: "Reefs off Reiff"
club: "tynemouth"
venue: "summer-isles"
description: |
  Last day at the Summer Isles with TPC.
  
  We set off as a large group of 15, rock hopping up the coast. We had lunch at Reiff where the sun made a brief but very welcome appearance.
  
  After lunch we split into two groups. My group led by Sarah and Kirstie headed North to do a little loop of Camas Eilean Ghlais. There was decent swell crashing against the cliffs. We turned South and crossed to Eilean Mullagrach to play in Kev's washing machine and visit Am Fang one more time. We crossed to Isle Ristol for a few more caves and rockhops before cutting the gap and paddling back to the campsite. It's been a soggy few days but some great paddles.