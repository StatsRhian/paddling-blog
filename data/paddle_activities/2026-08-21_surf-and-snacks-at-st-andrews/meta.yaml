description: |
  Nice little paddle out of St Andrews. We headed South first towards Fifeness and then back towards the town to view the castle & cathedral. Had a little play in the surf at W
  East Sands.
  
  Excellent toasty and ice-cream afterwards although maybe we should have paid the £1 seagull insurance as Kirstie got attacked by a gull 😅