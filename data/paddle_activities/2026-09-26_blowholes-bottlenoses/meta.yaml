date: "2026-09-26"
title: "Blowholes & bottlenoses"
club: "tynemouth"
venue: "south-shields"
description: |
  Strong winds meant we ditched our Plan A (Coquet island) in favour of South Shields, seeking shelter underneath the cliffs
  
  The swell was gentle but some features had a strong current which gave some fun rock surfs.
  
  The swell & tide was also at the perfect level for some of the blowholes to be spouting, resulting in silly fun getting sprayed.
  
  Despite the gusty winds, the sea state was fairly flat and we got all the way to the second arch at Whitburn.
  
  On the way back we spotted about 10 bottlenose dolphins in two groups. Chatted to a few friendly fisherman.
  
  Went to Up North for some pizza afterwards 😋
  
  Paul, Sarah, Kirstie, Gayle, Kane, Jonny, Julie & Kev P.
  Tim & Mark were also out on a peer paddle in their plastic river boats.