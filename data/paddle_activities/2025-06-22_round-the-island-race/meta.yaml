description: |
  The seals were out spectating. I set off near the back, planning a social paddle rather than a race. However, when I turned the corner and started paddling into the wind I realised I was picking up some speed and passing people. I caught a glimpse of Sarah but didn't manage to catch her. She won and I finished 2nd woman.