description: |
  First day of TPC Summer Isles trip. Lots of caves and arches. Particularly enjoyed returning to Am Fang cave which had a shag nesting in it. Had to skip a few potential lunch spots due to pregnant seals beached on the stony shore.
  
  Mark made pizza on the fire for everyone after. thanks Mark 😋
  
  Kirstie and Mark took me, Kev, Cath, Clare, Josh, Kane and Jonny