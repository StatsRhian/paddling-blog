date: "2026-09-02"
title: "Grey skies, lush company"
club: "peer"
venue: "tynemouth"
description: |
  It was grey and drizzly as we unloaded boats and paddled out on a rising tide.
  
  There was a bit of a tide race off the pier but it was nice and smooth. We paddled to Cullercoats to meet Gordon and did a short loop around the corner to Browns Bay.
  
  I enjoyed surfing the swell along the pier all the way back to the Haven.
  It was properly dark by the time we had cleaned our kit. The nights are definitley getting longer again.
  
  With Sarah, Paul, Ann, Pauline, Kane & Gordon